<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotte World Simulator — Early Build</title>
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d}
#scene{position:fixed;inset:0}
.hud{position:fixed;z-index:2;pointer-events:none}
.top{top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}
.brand,.panel{background:#101923d9;border:1px solid #ffffff20;backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 12px 40px #0005}
.brand{padding:12px 16px}.brand strong{display:block;font-size:14px;letter-spacing:.12em}.brand span{font-size:11px;color:#9eacbd}
.panel{padding:12px 14px;color:#dce5ef;font-size:12px;line-height:1.7;max-width:245px}
.bottom{bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.hint{padding:10px 13px;border-radius:12px;background:#101923d9;border:1px solid #ffffff20;color:#bdc9d7;font-size:11px}
.controls{display:flex;gap:7px;pointer-events:auto}
button{border:1px solid #ffffff26;background:#142333ed;color:#e7f0f8;padding:10px 13px;border-radius:10px;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:#24415a}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#10151d;color:#dce5ef;z-index:5;font-size:13px;transition:opacity .5s}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.label{position:absolute;transform:translate(-50%,-50%);padding:5px 8px;border-radius:7px;background:#0d1724d9;border:1px solid #ffffff24;color:#eaf3fb;font-size:10px;white-space:nowrap}
#paradeStatus{font-variant-numeric:tabular-nums}
#paradeStatus .live{color:#b9f2cf;font-weight:700}
@media(max-width:650px){.controls{gap:4px}.controls button{padding:8px 9px;font-size:10px}}
@media(max-width:650px){.top{left:10px;right:10px;top:10px}.panel{max-width:155px;font-size:10px}.bottom{left:10px;right:10px;bottom:10px}.hint{max-width:55%;font-size:10px}.brand{padding:9px 11px}}
</style>
</head>
<body>
<div id="scene"></div><div id="labels"></div>
<div id="loading">롯데월드 기본 공간을 구성하는 중…</div>
<div class="hud top">
  <div class="brand"><strong>LOTTE WORLD / SIMULATOR</strong><span>EARLY BLOCKOUT · 3D WORLD</span></div>
  <div class="panel">초기 외부 구조 빌드<br>어드벤처 돔 · 정문 광장 · 매직아일랜드 · 석촌호수 · 매직캐슬<div id="paradeStatus" style="margin-top:9px;padding-top:8px;border-top:1px solid #ffffff20;color:#fff1cf">계절별 퍼레이드<br>시즌에 맞는 테마가 자동 선택됩니다</div><span style="color:#8fa5ba">가상 시뮬레이션은 10분 간격으로 진행</span></div>
</div>
<div class="hud bottom">
  <div class="hint">마우스 드래그: 회전 · 휠: 확대/축소 · 우클릭 드래그: 이동</div>
  <div class="controls"><button id="paradeNow">퍼레이드 미리보기</button><button id="home">초기 시점</button><button id="labelsBtn">명칭 표시</button></div>
</div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb8c9);scene.fog=new THREE.Fog(0x9eb8c9,170,420);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);camera.position.set(150,115,165);

const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,12,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=35;controls.maxDistance=330;
scene.add(new THREE.HemisphereLight(0xe4f3ff,0x53616c,2.0));
const sun=new THREE.DirectionalLight(0xfff0d8,3.2);sun.position.set(-90,150,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-210;sun.shadow.camera.right=210;sun.shadow.camera.top=210;sun.shadow.camera.bottom=-210;scene.add(sun);
const mats={grass:new THREE.MeshStandardMaterial({color:0x668b69,roughness:1}),concrete:new THREE.MeshStandardMaterial({color:0xb9b8b0,roughness:.9}),road:new THREE.MeshStandardMaterial({color:0x505963,roughness:1}),wall:new THREE.MeshStandardMaterial({color:0xe7e1d4,roughness:.8}),roof:new THREE.MeshStandardMaterial({color:0x536b7d,roughness:.65}),glass:new THREE.MeshPhysicalMaterial({color:0x8eb8c8,metalness:.18,roughness:.22,transparent:true,opacity:.48}),blue:new THREE.MeshStandardMaterial({color:0x426c8c,roughness:.55}),gold:new THREE.MeshStandardMaterial({color:0xd6ad63,metalness:.35,roughness:.4}),water:new THREE.MeshStandardMaterial({color:0x4e8fa7,roughness:.18,metalness:.2}),dark:new THREE.MeshStandardMaterial({color:0x35404b,roughness:.8})};
function mat(color,roughness=.8){return new THREE.MeshStandardMaterial({color,roughness})}

function label(text,x,y,z){const el=document.createElement('div');el.className='label';el.textContent=text;labelLayer.appendChild(el);labels.push({el,p:new THREE.Vector3(x,y,z)})}
const labels=[];

// outer approach roads and landscaped public realm

box(scene,0,.12,77,190,.25,28,mats.concrete);
for(let i=-8;i<=8;i++){cyl(scene,i*10,0,91,2.1,2.1,2.8,mat(0x806b50));sphere(scene,i*10,3.8,91,3.2,3.1,3.2,mat(0x477b55));}

const domeWire=new THREE.Mesh(new THREE.WireframeGeometry(new THREE.SphereGeometry(1,24,12)),new THREE.LineBasicMaterial({color:0xc6d9df,transparent:true,opacity:.55}));domeWire.position.set(0,35,18);domeWire.scale.set(69,34,42);scene.add(domeWire);
// entrance portico and towers

for(const x of [-31,31]){box(scene,x,2,68,9,24,10,mats.wall);cyl(scene,x,26,68,5,4,5,mats.roof);sphere(scene,x,33,68,2.2,3.5,2.2,mats.gold)}
// side wings / service blocks
box(scene,-89,1,10,26,20,68,mats.wall);box(scene,89,1,10,26,20,68,mats.wall);
box(scene,-88,21,10,28,2,70,mats.roof);box(scene,88,21,10,28,2,70,mats.roof);
// lake around Magic Island
const lake=new THREE.Mesh(new THREE.CircleGeometry(83,96),mats.water);lake.rotation.x=-Math.PI/2;lake.scale.set(1.18,.76,1);lake.position.set(0,.02,-112);lake.receiveShadow=true;scene.add(lake);
// island land mass
const island=new THREE.Mesh(new THREE.CylinderGeometry(57,64,3,64),mats.grass);island.position.set(0,1.2,-112);island.scale.z=.76;island.receiveShadow=true;island.castShadow=true;scene.add(island);
// castle on island: keep, wings, turrets, spires
box(scene,0,3,-119,28,24,19,mats.wall);box(scene,0,27,-119,34,4,24,mats.blue);
for(const x of [-19,19]){box(scene,x,3,-119,12,17,15,mats.wall);cyl(scene,x,20,-119,6,6,5,mats.blue);const sp=new THREE.Mesh(new THREE.ConeGeometry(5,15,8),mats.roof);sp.position.set(x,32,-119);sp.castShadow=true;scene.add(sp)}
box(scene,0,3,-101,10,15,8,mats.wall);const mainSpire=new THREE.Mesh(new THREE.ConeGeometry(6,18,8),mats.gold);mainSpire.position.set(0,23,-101);scene.add(mainSpire);
for(let i=0;i<8;i++){const a=i*Math.PI/4;const x=Math.cos(a)*42,z=-112+Math.sin(a)*30;const t=new THREE.Group();t.position.set(x,2,z);scene.add(t);cyl(t,0,0,0,2.8,3.2,2.2,mats.dark);const s=new THREE.Mesh(new THREE.ConeGeometry(2.5,8,8),mats.gold);s.position.y=7;s.castShadow=true;t.add(s)}
// perimeter paths
const pathMat=mat(0xd5d0c3);const path=new THREE.Mesh(new THREE.TorusGeometry(69,3,8,100),pathMat);path.rotation.x=Math.PI/2;path.position.set(0,2.9,-112);path.scale.set(1.15,.75,1);scene.add(path);
// landmark ride silhouettes around island (non-detailed placeholders)
function coasterTrack(points,r=.75){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,180,r,8,false),mats.gold);mesh.castShadow=true;scene.add(mesh)}
coasterTrack([[-65,5,-155],[-52,22,-166],[-35,10,-150],[-12,28,-164],[10,7,-152],[34,24,-160],[56,8,-140]],.85);
for(let i=0;i<8;i++){const x=-55+i*15;box(scene,x,1,-155,1,13,1,mats.dark)}
// gyro drop tower
cyl(scene,57,2,-91,3,4,48,mats.dark);cyl(scene,57,48,-91,7,7,2,mats.gold);
// ferris / observation wheel placeholder
const wheel=new THREE.Mesh(new THREE.TorusGeometry(17,1.1,10,64),mats.blue);wheel.position.set(-58,23,-95);scene.add(wheel);for(let i=0;i<12;i++){const a=i*Math.PI/6;const x=-58+Math.cos(a)*17,y=23+Math.sin(a)*17;const spoke=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,34,8),mats.gold);spoke.position.set(x,y,-95);spoke.rotation.z=a;scene.add(spoke)}
// urban context blocks outside park perimeter
for(let i=0;i<7;i++){const x=-160+i*52;box(scene,x,0,-205,28,22+(i%3)*13,24,mat(i%2?0x9babb2:0xb9b6a9))}
for(let i=0;i<5;i++){const x=125+i*13;box(scene,x,0,-30-i*36,9,30+(i%2)*16,13,mat(0x899ba6))}
// entrance plaza paving bands
for(let i=0;i<9;i++)box(scene,-72+i*18,.23,84,16,.08,1.1,mat(i%2?0xc7c4ba:0x9da7a8));
label('LOTTE WORLD ADVENTURE',0,51,18);label('MAIN ENTRANCE',0,25,80);label('MAGIC ISLAND',0,8,-112);label('MAGIC CASTLE',0,45,-118);label('SEOKCHON LAKE',-80,4,-160);
let showLabels=true;

// Seasonal parade system: the simulation runs a parade every ten real-time minutes.
const nowDate = new Date();
const month = nowDate.getMonth() + 1;
const seasons = {
  winter: {title:'해피 크리스마스 퍼레이드', subtitle:'스위트 윈터 어드벤처', deck:0xd9e9f3, trim:0xd8ad65, accent:0x8f2636},
  spring: {title:'Let\'s Play! 로티스 어드벤처 퍼레이드', subtitle:'봄 시즌 테마', deck:0xe9b6c8, trim:0xffe6a8, accent:0x78a96b},
  summer: {title:'썸머 페스티벌 퍼레이드', subtitle:'여름 시즌 테마', deck:0x54a8c7, trim:0xffd166, accent:0x287a9a},
  autumn: {title:'Dark Fantasy Festival', subtitle:'가을 시즌 테마', deck:0x553d59, trim:0xe6a24e, accent:0x9c4b37}
};
const seasonKey = (month===11 || month===12 || month===1 || month===2) ? 'winter'
  : (month>=3 && month<=5) ? 'spring' : (month>=6 && month<=8) ? 'summer' : 'autumn';
const season = seasons[seasonKey];

const paradeGroup = new THREE.Group();
paradeGroup.visible = false;
scene.add(paradeGroup);
const paradeFloats = [];
const paradeRoutePoints = [
  [-40,22,3],[-29,22,-6],[-8,22,-10],[15,22,-8],[37,22,1],
  [44,22,15],[41,22,31],[24,22,42],[2,22,45],[-20,22,42],
  [-40,22,31],[-44,22,15]
].map(p=>new THREE.Vector3(p[0],p[1],p[2]));
const paradeRoute = new THREE.CatmullRomCurve3(paradeRoutePoints,true,'catmullrom',0.35);

function paradeBox(parent,x,y,z,w,h,d,material){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y+h/2,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function paradeSphere(parent,x,y,z,rx,ry,rz,material){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material);
  mesh.position.set(x,y,z);mesh.scale.set(rx,ry,rz);mesh.castShadow=true;parent.add(mesh);return mesh;
}
function paradeCone(parent,x,y,z,r,h,material){
  const mesh=new THREE.Mesh(new THREE.ConeGeometry(r,h,12),material);
  mesh.position.set(x,y+h/2,z);mesh.castShadow=true;parent.add(mesh);return mesh;
}
function makeParadeFloat(index){
  const root=new THREE.Group();
  const deckMat=new THREE.MeshStandardMaterial({color:season.deck,roughness:.55,metalness:.12});
  const trimMat=new THREE.MeshStandardMaterial({color:season.trim,metalness:.35,roughness:.35});
  const accentMat=new THREE.MeshStandardMaterial({color:season.accent,roughness:.55});
  const whiteMat=new THREE.MeshStandardMaterial({color:0xf5f7f4,roughness:.7});
  const darkMat=new THREE.MeshStandardMaterial({color:0x29333d,roughness:.8});
  paradeBox(root,0,1.4,0,12,1.1,6,deckMat);
  paradeBox(root,0,2.45,0,12.3,.22,6.3,trimMat);
  for(const x of [-4.1,4.1]) for(const z of [-2.35,2.35]){
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.55,20),darkMat);
    wheel.rotation.x=Math.PI/2;wheel.position.set(x,1.35,z);wheel.castShadow=true;root.add(wheel);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.58,16),trimMat);
    hub.rotation.x=Math.PI/2;hub.position.copy(wheel.position);root.add(hub);
  }
  if(seasonKey==='winter'){
    if(index===0){
      paradeBox(root,0,2.7,0,2.2,2.1,2.2,accentMat);
      for(let tier=0;tier<4;tier++) paradeCone(root,0,4.3+tier*1.45,0,4.4-tier*.78,2.6,mat(0x1f7254,.7));
      const star=new THREE.Mesh(new THREE.OctahedronGeometry(1.35),trimMat);star.position.set(0,11.3,0);root.add(star);
      for(let i=0;i<18;i++){const a=i*2.399,r=1.5+(i%3)*.65;paradeSphere(root,Math.cos(a)*r,4.8+(i%4)*1.35,Math.sin(a)*r,.38,.38,.38,i%2?trimMat:accentMat)}
      // Generic winter mascot, not a branded character.
      paradeSphere(root,-2,4.4,2.1,.95,1.05,.72,mat(0x8a573d));
      paradeSphere(root,-2,5.85,2.1,.9,.9,.75,mat(0x8a573d));
      paradeSphere(root,-2.35,5.95,2.76,.12,.16,.08,whiteMat);
      paradeSphere(root,-1.65,5.95,2.76,.12,.16,.08,whiteMat);
      paradeSphere(root,-2,5.5,2.82,.14,.14,.1,mat(0x34252a));
      for(let b=0;b<3;b++)paradeSphere(root,-2,4.25+b*.35,2.78,.13,.13,.1,trimMat);
    } else if(index===1){
      for(let i=0;i<3;i++){const x=-3.3+i*3.3;
        paradeBox(root,x,3.1,0,2.5,2.4,2.5,i%2?accentMat:trimMat);
        paradeBox(root,x,5.52,0,.38,.18,2.65,whiteMat);
        paradeBox(root,x,5.52,0,2.65,.18,.38,whiteMat);
      }
      paradeSphere(root,0,7.4,0,1.55,1.55,1.55,whiteMat);
      paradeSphere(root,0,9.25,0,1.15,1.15,1.15,whiteMat);
      paradeSphere(root,-.35,9.4,.98,.13,.16,.08,darkMat);paradeSphere(root,.35,9.4,.98,.13,.16,.08,darkMat);
      paradeCone(root,0,8.3,1.05,.32,.8,season.trim?trimMat:accentMat);
      for(let j=0;j<3;j++)paradeSphere(root,0,7.1+j*.55,1.45,.13,.13,.1,accentMat);
      paradeCone(root,0,10.5,0,.42,.8,trimMat);
    } else {
      const globeMat=new THREE.MeshPhysicalMaterial({color:0xc8e5f4,transparent:true,opacity:.38,roughness:.08,metalness:.1});
      paradeSphere(root,0,7.1,0,3.2,3.2,3.2,globeMat);
      paradeBox(root,0,3.1,0,4.8,1.1,3.2,accentMat);
      paradeBox(root,0,4.5,0,2.2,2.3,2.1,whiteMat);
      paradeCone(root,0,6.4,0,1.8,1.4,trimMat);
      for(let i=0;i<8;i++){const a=i*Math.PI/4;paradeSphere(root,Math.cos(a)*2,6.5+Math.sin(a)*1.3,Math.sin(a)*2,.22,.22,.22,trimMat)}
    }
  } else {
    const mainColor = seasonKey==='spring'?0xe9a7c0:seasonKey==='summer'?0xffcf68:0x6c4b70;
    const mainMat=mat(mainColor,.55);
    paradeSphere(root,0,6.6,0,2.7,2.7,2.7,mainMat);
    for(let i=0;i<8;i++){const a=i*Math.PI/4;paradeSphere(root,Math.cos(a)*3.1,6.4,Math.sin(a)*2.1,1.1,1.1,1.1,trimMat)}
    if(seasonKey==='autumn') paradeCone(root,0,8.8,0,1.2,2.2,accentMat);
    else paradeSphere(root,0,9,0,1.1,1.1,1.1,trimMat);
  }
  return root;
}
for(let i=0;i<3;i++){const float=makeParadeFloat(i);paradeGroup.add(float);paradeFloats.push(float)}
const paradeStatus=document.querySelector('#paradeStatus');
const PARADE_INTERVAL=10*60*1000;
const FLOAT_TRAVEL_TIME=80000;
const PARADE_LASTS=FLOAT_TRAVEL_TIME+30000;
let nextParadeAt=performance.now()+PARADE_INTERVAL;
let paradeStartedAt=null;
function clockText(ms){const seconds=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startSeasonalParade(){
  if(paradeStartedAt!==null && performance.now()-paradeStartedAt<PARADE_LASTS)return;
  paradeStartedAt=performance.now();
  paradeGroup.visible=true;
  paradeFloats.forEach(f=>f.visible=false);
  paradeStatus.innerHTML='<span class="live">● 퍼레이드 진행 중</span><br>'+season.title+' · 겨울 축제 플로트가 어드벤처 1층 코스를 이동합니다.';
}
function updateParade(now){
  if(now>=nextParadeAt){startSeasonalParade();nextParadeAt=now+PARADE_INTERVAL}
  if(paradeStartedAt!==null){
    const elapsed=now-paradeStartedAt;
    if(elapsed>=PARADE_LASTS){paradeGroup.visible=false;paradeStartedAt=null}
    else {
      paradeFloats.forEach((float,i)=>{
        const delay=i*15000;
        const progress=Math.max(0,Math.min(1,(elapsed-delay)/FLOAT_TRAVEL_TIME));
        float.visible=elapsed>=delay && progress<=1;
        if(float.visible){
          const p=paradeRoute.getPointAt(progress);
          const tangent=paradeRoute.getTangentAt(Math.min(.9999,progress)).normalize();
          float.position.copy(p);
          float.rotation.y=Math.atan2(tangent.x,tangent.z);
          float.position.y=p.y+Math.sin(now/260+i)*.12;
        }
      });
    }
  }
  if(paradeStartedAt!==null){
    const remaining=Math.max(0,PARADE_LASTS-(now-paradeStartedAt));
    paradeStatus.innerHTML='<span class="live">● 퍼레이드 진행 중</span><br>'+season.title+' · 종료까지 '+clockText(remaining);
  } else {
    paradeStatus.innerHTML=season.title+'<br>다음 퍼레이드까지 '+clockText(nextParadeAt-now);
  }
}
document.querySelector('#paradeNow').addEventListener('click',startSeasonalParade);

document.querySelector('#home').onclick=()=>{camera.position.set(150,115,165);controls.target.set(0,12,0);controls.update()};
document.querySelector('#labelsBtn').onclick=()=>{showLabels=!showLabels;updateLabels()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();updateParade(performance.now());renderer.render(scene,camera);updateLabels()}animate();
setTimeout(()=>{const l=document.querySelector('#loading');l.style.opacity=0;setTimeout(()=>l.remove(),550)},900);
</script>
