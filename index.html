.panel{padding:12px 14px;color:#dce5ef;font-size:12px;line-height:1.7;max-width:245px}
.bottom{bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;gap:12px}

button{border:1px solid #ffffff26;background:#142333ed;color:#e7f0f8;padding:10px 13px;border-radius:10px;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:#24415a}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#10151d;color:#dce5ef;z-index:5;font-size:13px;transition:opacity .5s}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.label{position:absolute;transform:translate(-50%,-50%);padding:5px 8px;border-radius:7px;background:#0d1724d9;border:1px solid #ffffff24;color:#eaf3fb;font-size:10px;white-space:nowrap}
#paradeStatus{font-variant-numeric:tabular-nums}
#paradeStatus .live{color:#b9f2cf;font-weight:700}
@media(max-width:650px){.controls{gap:4px}.controls button{padding:8px 9px;font-size:10px}}
@media(max-width:650px){.top{left:10px;right:10px;top:10px}.panel{max-width:155px;font-size:10px}.bottom{left:10px;right:10px;bottom:10px}.hint{max-width:55%;font-size:10px}.brand{padding:9px 11px}}

#interactionPrompt{position:fixed;z-index:6;left:50%;bottom:82px;transform:translateX(-50%);padding:11px 16px;border-radius:13px;background:#101923e8;border:1px solid #ffffff2a;color:#eff6fd;font-size:12px;text-align:center;min-width:230px;max-width:min(92vw,480px);pointer-events:none;box-shadow:0 10px 30px #0005}
#mobileAction{display:none;position:fixed;z-index:8;right:18px;bottom:24px;border-radius:999px;min-width:112px;min-height:54px;background:#f1c66e;color:#18202a;font-weight:800;box-shadow:0 8px 28px #0005}

#mobilePad button{padding:0;border-radius:13px;background:#101923d9;border:1px solid #ffffff45;font-size:16px;touch-action:none;user-select:none}
#mobilePad button[data-move=forward]{grid-column:2;grid-row:1}
#mobilePad button[data-move=left]{grid-column:1;grid-row:2}
#mobilePad button[data-move=back]{grid-column:2;grid-row:3}
#mobilePad button[data-move=right]{grid-column:3;grid-row:2}
#simModal{display:none;position:fixed;inset:0;z-index:30;background:#030912b8;backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}

.modalCard{position:relative;width:min(520px,100%);max-height:82vh;overflow:auto;border:1px solid #ffffff25;border-radius:20px;background:#111d2a;color:#edf4fb;padding:25px;box-shadow:0 24px 80px #0009}
.modalClose{position:absolute;right:12px;top:12px;border-radius:50%;width:36px;height:36px;padding:0;font-size:15px}
.modalEyebrow{color:#e6bd72;font-size:11px;letter-spacing:.12em;font-weight:800}
.modalCard h2{margin:8px 36px 8px 0;font-size:22px}
.modalCard p{color:#aebdca;line-height:1.65;font-size:13px}

.modalActions button,.choiceButton{border-radius:11px;padding:11px 14px;background:#203950;border:1px solid #ffffff24;color:#f1f7fb;cursor:pointer}
.modalActions button.primary{background:#e7bd6b;color:#1a2430;font-weight:800}
.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.choiceButton{text-align:left;display:flex;flex-direction:column;gap:4px}

@media(max-width:700px),(pointer:coarse){
  #mobilePad{display:grid}
  #mobileAction{display:block}
  .bottom{bottom:8px;left:165px;right:10px;justify-content:flex-end}
  .bottom .hint{display:none}
  .controls button{font-size:9px;padding:8px}
  .top{left:8px;right:8px;top:8px}
  .panel{max-width:165px;font-size:10px;padding:9px}
  .brand{padding:9px 11px}
  #interactionPrompt{bottom:175px;font-size:11px}
  .modalCard{padding:21px 17px}
}
</style>
</head>

const paradeStatus=document.querySelector('#paradeStatus');
const PARADE_INTERVAL=10*60*1000;
const FLOAT_TRAVEL_TIME=80000;
const PARADE_LASTS=FLOAT_TRAVEL_TIME+30000;
let nextParadeAt=performance.now()+PARADE_INTERVAL;
let paradeStartedAt=null;
function clockText(ms){const seconds=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startSeasonalParade(){
  if(paradeStartedAt!==null && performance.now()-paradeStartedAt<PARADE_LASTS)return;
  paradeStartedAt=performance.now();
  paradeGroup.visible=true;
  paradeFloats.forEach(f=>f.visible=false);
  paradeStatus.innerHTML='<span class="live">● 퍼레이드 진행 중</span><br>'+season.title+' · 겨울 축제 플로트가 어드벤처 1층 코스를 이동합니다.';
}
function updateParade(now){
  if(now>=nextParadeAt){startSeasonalParade();nextParadeAt=now+PARADE_INTERVAL}
  if(paradeStartedAt!==null){
    const elapsed=now-paradeStartedAt;
    if(elapsed>=PARADE_LASTS){paradeGroup.visible=false;paradeStartedAt=null}
    else {
      paradeFloats.forEach((float,i)=>{
        const delay=i*15000;
        const progress=Math.max(0,Math.min(1,(elapsed-delay)/FLOAT_TRAVEL_TIME));
        float.visible=elapsed>=delay && progress<=1;
        if(float.visible){
          const p=paradeRoute.getPointAt(progress);
          const tangent=paradeRoute.getTangentAt(Math.min(.9999,progress)).normalize();
          float.position.copy(p);
          float.rotation.y=Math.atan2(tangent.x,tangent.z);
          float.position.y=p.y+Math.sin(now/260+i)*.12;
        }
      });
    }
  }
  if(paradeStartedAt!==null){
    const remaining=Math.max(0,PARADE_LASTS-(now-paradeStartedAt));
    paradeStatus.innerHTML='<span class="live">● 퍼레이드 진행 중</span><br>'+season.title+' · 종료까지 '+clockText(remaining);
  } else {
    paradeStatus.innerHTML=season.title+'<br>다음 퍼레이드까지 '+clockText(nextParadeAt-now);
  }
}

    for(let j=0;j<9;j++){const step=box(g,0,.15+j*.27,-4.2+j*.95,4,.16,.85,mat(0x9cabb5));}
    box(g,-2,1,0,.14,3,10,mat(0xe0bb70));box(g,2,1,0,.14,3,10,mat(0xe0bb70));
  }else{
    box(g,0,.2,0,4,2.6,3.5,color);
    box(g,0,3,0,4.4,.3,3.8,mat(0xe4c176));
    box(g,0,1.7,1.85,2.5,1.2,.12,mat(0x1d2c3a));
  }
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(8.5,1.9),new THREE.MeshBasicMaterial({map:signTexture(f.name, f.kind==='ride'?'#78c3e9':f.kind==='restaurant'?'#f1b977':f.kind==='shop'?'#c9a1ed':'#86d5c0'),side:THREE.DoubleSide,transparent:true}));
  sign.position.set(0,7.3,2.8);g.add(sign);
  return g;
}
facilityCatalog.forEach(f=>{buildFacilityModel(f);facilities.push(f)});

// A single walkable avatar. Orbit controls become a third-person follow camera.
const player=new THREE.Group();scene.add(player);
const playerMat=mat(0x3c94b9,.6),skinMat=mat(0xf0cba9,.75);
cyl(player,0,.15,0,.62,.68,1.15,playerMat,20);
sphere(player,0,1.65,0,.48,.48,.48,skinMat);
box(player,0,.8,.48,.65,.18,.2,mat(0xe8be73));
player.position.set(0,floorHeight['1F'],79);
const spawnPosition=player.position.clone();
controls.target.set(player.position.x,player.position.y+1.25,player.position.z);
camera.position.set(0,player.position.y+8,player.position.z+19);
controls.update();

const keyState={};const touchState={forward:false,back:false,left:false,right:false};
let activeFacility=null,currentRide=null,elevatorTransit=null,foodTransit=null,toastTimer=null;
const prompt=document.querySelector('#interactionPrompt');
const actionButton=document.querySelector('#mobileAction');
const modal=document.querySelector('#simModal'),modalBody=document.querySelector('#modalBody');
function showToast(message){
  const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function escHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function openModal(content){modalBody.innerHTML=content;modal.classList.add('open');modal.setAttribute('aria-hidden','false');}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
document.querySelector('#modalClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
function currentFloor(){
  let best='1F',dist=Infinity;
  for(const [name,y] of Object.entries(floorHeight)){const d=Math.abs(player.position.y-y);if(d<dist){dist=d;best=name}}
  return best;
}
function nearestInteractable(){
  if(currentRide||elevatorTransit||modal.classList.contains('open'))return null;
  let nearest=null,best=9.5;
  for(const f of facilities){
    if(['elevator','escalator','stairs'].includes(f.kind)&&f.multi){
      const d=Math.hypot(player.position.x-f.x,player.position.z-f.z);
      if(d<best){best=d;nearest=f}continue;
    }
    const floorMatch=f.floor==='매직아일랜드'
      ? player.position.z<-61
      : Math.abs(player.position.y-(floorHeight[f.floor]??0))<3.5;
    if(!floorMatch)continue;
    const d=Math.hypot(player.position.x-f.x,player.position.z-f.z);
    if(d<best){best=d;nearest=f}
  }
  return nearest;
}
function renderPrompt(){
  activeFacility=nearestInteractable();
  if(activeFacility){
    const how=activeFacility.kind==='ride'?'탑승하기':activeFacility.kind==='restaurant'?'식당 이용하기':activeFacility.kind==='elevator'?'층 선택하기':activeFacility.kind==='escalator'||activeFacility.kind==='stairs'?'층 이동하기':activeFacility.kind==='shop'?'매장 둘러보기':'시설 이용하기';
    prompt.textContent=activeFacility.name+' · '+how+'  [E]';
    actionButton.textContent=how;
    actionButton.style.background='#f1c66e';
  }else{
    prompt.textContent='가까운 시설로 이동하면 이용 안내가 표시됩니다.';
    actionButton.textContent=currentRide?'탑승 중…':'가까이 이동하세요';
    actionButton.style.background='#27394b'; 
  }
}
function rideDescription(f){
  if(/롤러|레볼루션|아트란티스|혜성특급|카트라이더|모노레일/.test(f.name))return '차량에 탑승해 코스를 따라 이동하는 어트랙션 체험';
  if(/드롭|타워|풍선비행/.test(f.name))return '높이 올라가 파크의 전경을 둘러보는 체험';
  if(/해적선|스윙|자이로/.test(f.name))return '회전하거나 흔들리는 탑승 장치를 체험';
  if(/보트|후룸|신밧드|드림/.test(f.name))return '보트에 탑승해 실내 코스를 이동하는 체험';
  return '이 시설의 가상 탑승 체험을 시작합니다.';
}
function showFacility(f){
  if(f.kind==='ride'){
    openModal('<div class="modalEyebrow">'+escHtml(f.floor)+' · ATTRACTION</div><h2>'+escHtml(f.name)+'</h2><p>'+escHtml(rideDescription(f))+'</p><p>가상 탑승 시간 약 18초 · 언제든 체험 종료 후 원래 위치로 돌아옵니다.</p><div class="modalActions"><button class="primary" id="doRide">탑승하기</button><button id="cancelModal">취소</button></div>');
    document.querySelector('#doRide').onclick=()=>{closeModal();startRide(f)};
    document.querySelector('#cancelModal').onclick=closeModal;
  }else if(f.kind==='restaurant'){
    const menus=['대표 메뉴','세트 메뉴','음료·디저트'];
    openModal('<div class="modalEyebrow">'+escHtml(f.floor)+' · DINING</div><h2>'+escHtml(f.name)+'</h2><p>가상 식당 체험입니다. 메뉴를 선택하면 테이블에서 식사하는 장면이 진행됩니다.</p><div class="choiceGrid">'+menus.map((m,i)=>'<button class="choiceButton" data-menu="'+i+'">'+m+'<small>가상 메뉴 선택</small></button>').join('')+'</div><div id="foodMessage"></div><div class="modalActions"><button id="cancelModal">나가기</button></div>');
    modalBody.querySelectorAll('[data-menu]').forEach(btn=>btn.addEventListener('click',()=>startMeal(f,menus[Number(btn.dataset.menu)])));
    document.querySelector('#cancelModal').onclick=closeModal;
  }else if(f.kind==='elevator'){
    openModal('<div class="modalEyebrow">VERTICAL TRANSPORT</div><h2>'+escHtml(f.name)+'</h2><p>이동할 층을 선택하세요. 엘리베이터가 층 사이를 이동합니다.</p><div class="choiceGrid">'+floorOrder.map(fl=>'<button class="choiceButton" data-floor="'+fl+'">'+fl+'<small>이 층으로 이동</small></button>').join('')+'</div><div class="modalActions"><button id="cancelModal">닫기</button></div>');
    modalBody.querySelectorAll('[data-floor]').forEach(btn=>btn.addEventListener('click',()=>startElevator(f,btn.dataset.floor)));
    document.querySelector('#cancelModal').onclick=closeModal;
  }else if(f.kind==='escalator'||f.kind==='stairs'){
    const here=currentFloor(),idx=floorOrder.indexOf(here);
    const prev=floorOrder[Math.max(0,idx-1)],next=floorOrder[Math.min(floorOrder.length-1,idx+1)];
    openModal('<div class="modalEyebrow">FLOOR CONNECTION</div><h2>'+escHtml(f.name)+'</h2><p>연결된 층으로 이동합니다.</p><div class="modalActions"><button class="primary" id="goNext">'+next+'로 이동</button><button id="goPrev">'+prev+'로 이동</button><button id="cancelModal">취소</button></div>');
    document.querySelector('#goNext').onclick=()=>{closeModal();teleportFloor(f,next)};
    document.querySelector('#goPrev').onclick=()=>{closeModal();teleportFloor(f,prev)};
    document.querySelector('#cancelModal').onclick=closeModal;
  }else if(f.kind==='shop'){
    openModal('<div class="modalEyebrow">'+escHtml(f.floor)+' · SHOP</div><h2>'+escHtml(f.name)+'</h2><p>매장 내부를 둘러보는 가상 체험입니다. 상품 진열대를 살펴보고 쇼핑 화면을 이용할 수 있습니다.</p><div class="modalActions"><button class="primary" id="browseShop">매장 둘러보기</button><button id="cancelModal">닫기</button></div>');
    document.querySelector('#browseShop').onclick=()=>{openModal('<div class="modalEyebrow">SHOPPING</div><h2>'+escHtml(f.name)+'</h2><p>가상 매장 둘러보기를 완료했습니다. 실제 결제나 구매는 진행되지 않습니다.</p><div class="modalActions"><button id="doneShop" class="primary">완료</button></div>');document.querySelector('#doneShop').onclick=closeModal};
    document.querySelector('#cancelModal').onclick=closeModal;
  }else{
    openModal('<div class="modalEyebrow">PARK SERVICE</div><h2>'+escHtml(f.name)+'</h2><p>'+escHtml(f.detail||'편의시설의 위치와 이용 정보를 확인합니다.')+'</p><div class="modalActions"><button class="primary" id="serviceDone">확인</button></div>');
    document.querySelector('#serviceDone').onclick=closeModal;
  }
}
function tryInteract(){if(activeFacility)showFacility(activeFacility);else showToast('이용할 시설 가까이 이동해 주세요.')}
document.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(key==='escape'){closeModal();return}
  if(key==='e'){if(!e.repeat)tryInteract();return}
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)){keyState[key]=true;e.preventDefault()}
});
document.addEventListener('keyup',e=>{keyState[e.key.toLowerCase()]=false});
document.querySelectorAll('#mobilePad button').forEach(btn=>{
  const dir=btn.dataset.move;
  btn.addEventListener('pointerdown',e=>{e.preventDefault();touchState[dir]=true;btn.setPointerCapture(e.pointerId)});
  const release=e=>{e.preventDefault();touchState[dir]=false};
  btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',()=>{touchState[dir]=false});
});
actionButton.addEventListener('click',tryInteract);
function startRide(f){
  const vehicle=new THREE.Group();scene.add(vehicle);
  const shell=mat(0x3e7895,.45),seat=mat(0xe8bd68,.55);
  const base=new THREE.Mesh(new THREE.BoxGeometry(2.8,1,2),shell);base.position.y=.8;vehicle.add(base);
  for(let i=-1;i<=1;i++){const chair=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),seat);chair.position.set(i*.75,1.55,0);vehicle.add(chair)}
  const origin=new THREE.Vector3(f.x,floorHeight[f.floor]??floorHeight['1F'],f.z);
  player.visible=false;
  currentRide={facility:f,vehicle,origin,started:performance.now(),duration:18000};
  showToast(f.name+' 탑승을 시작합니다.');
}
function endRide(){
  if(!currentRide)return;
  const ride=currentRide;scene.remove(ride.vehicle);player.visible=true;
  player.position.set(ride.origin.x,ride.origin.y,ride.origin.z+5);
  currentRide=null;
  const target=new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z);
  const delta=target.clone().sub(controls.target);camera.position.add(delta);controls.target.copy(target);controls.update();
  showToast('탑승이 종료되었습니다. 하차했습니다.');
}
function updateRide(now){
  if(!currentRide)return;
  const r=currentRide,elapsed=now-r.started,p=Math.min(1,elapsed/r.duration),a=p*Math.PI*2;
  const f=r.facility;
  let x=r.origin.x+Math.cos(a)*5,z=r.origin.z+Math.sin(a)*5,y=r.origin.y+1.3+Math.max(0,Math.sin(a*2))*2;
  if(/드롭|타워/.test(f.name)){x=r.origin.x;z=r.origin.z;y=r.origin.y+1.3+(p<.55?p/.55*8:(1-(p-.55)/.45)*8)}
  if(/해적선|자이로|스윙/.test(f.name)){x=r.origin.x;z=r.origin.z;y=r.origin.y+1.5+Math.sin(a*2)*2;r.vehicle.rotation.z=Math.sin(a*2)*.55}
  r.vehicle.position.set(x,y,z);r.vehicle.rotation.y=-a;
  const target=new THREE.Vector3(x,y+1,z);
  const delta=target.clone().sub(controls.target);camera.position.add(delta);controls.target.copy(target);controls.update();
  if(elapsed>=r.duration)endRide();
}
function startElevator(f,destination){
  closeModal();const from=currentFloor(),toY=floorHeight[destination];
  if(from===destination){showToast('이미 '+destination+'에 있습니다.');return}
  elevatorTransit={facility:f,fromY:player.position.y,toY,from:performance.now(),duration:2400,destination};
  showToast('엘리베이터가 '+destination+'으로 이동합니다.');
}
function teleportFloor(f,destination){
  const y=floorHeight[destination];if(y===undefined)return;
  player.position.y=y;player.position.x=f.x;player.position.z=f.z+6;
  controls.target.set(player.position.x,player.position.y+1.25,player.position.z);
  camera.position.set(player.position.x,player.position.y+8,player.position.z+17);controls.update();
  showToast(destination+' 도착');
}
function updateElevator(now){
  if(!elevatorTransit)return;
  const t=Math.min(1,(now-elevatorTransit.from)/elevatorTransit.duration);
  const eased=t*t*(3-2*t);
  player.position.y=elevatorTransit.fromY+(elevatorTransit.toY-elevatorTransit.fromY)*eased;
  const target=new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z);
  const delta=target.clone().sub(controls.target);camera.position.add(delta);controls.target.copy(target);controls.update();
  if(elevatorTransit.facility.cabin)elevatorTransit.facility.cabin.position.y=player.position.y-floorHeight['B1F']+0.5;
  if(t>=1){const dest=elevatorTransit.destination;player.position.y=floorHeight[dest];if(elevatorTransit.facility.cabin)elevatorTransit.facility.cabin.position.y=player.position.y-floorHeight['B1F']+0.5;elevatorTransit=null;showToast(dest+' 도착');}
}
function startMeal(f,menu){
  closeModal();if(foodTransit)return;
  foodTransit={facility:f,menu,started:performance.now(),duration:7000};
  showToast(menu+' 선택 · 식사 체험 시작');
}
function updateMeal(now){
  if(!foodTransit)return;
  if(now-foodTransit.started>=foodTransit.duration){showToast(facilityName(foodTransit.facility)+' 식사 체험 완료');foodTransit=null;}
}
function facilityName(f){return f&&f.name?f.name:'시설'}
function updateWalk(dt){
  if(currentRide||elevatorTransit||foodTransit||modal.classList.contains('open'))return;
  const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
  const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
  let forwardInput=(keyState.w||keyState.arrowup||touchState.forward?1:0)-(keyState.s||keyState.arrowdown||touchState.back?1:0);
  let sideInput=(keyState.d||keyState.arrowright||touchState.right?1:0)-(keyState.a||keyState.arrowleft||touchState.left?1:0);
  const direction=forward.clone().multiplyScalar(forwardInput).add(right.multiplyScalar(sideInput));
  if(direction.lengthSq()>0){
    direction.normalize();const speed=dt*19;
    player.position.addScaledVector(direction,speed);
    player.rotation.y=Math.atan2(direction.x,direction.z);
  }
  const onIsland=player.position.z<=-67;
  if(onIsland){
    player.position.x=THREE.MathUtils.clamp(player.position.x,-62,62);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-166,-67);
    const ellipse=(player.position.x/63)**2+((player.position.z+112)/49)**2;
    if(ellipse>1.12){player.position.z=-66.5;player.position.x=THREE.MathUtils.clamp(player.position.x,-5.5,5.5)}
  }else{
    player.position.x=THREE.MathUtils.clamp(player.position.x,-69,69);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-29,87);
    if(currentFloor()!=='1F')player.position.z=THREE.MathUtils.clamp(player.position.z,-23,63);
    // On the bridge, keep the visitor on the deck over the lake.
    if(player.position.z<-30&&player.position.z>-67)player.position.x=THREE.MathUtils.clamp(player.position.x,-5.5,5.5);
  }
  if(player.position.z>63&&floor==='1F')player.position.y=floorHeight['1F'];
  const target=new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z);
  const delta=target.clone().sub(controls.target);camera.position.add(delta);controls.target.copy(target);controls.update();
}
function updateInteraction(){
  renderPrompt();
}


document.querySelector('#home').onclick=()=>{closeModal();if(currentRide)endRide();player.position.copy(spawnPosition);player.visible=true;camera.position.set(0,player.position.y+8,player.position.z+19);controls.target.set(player.position.x,player.position.y+1.25,player.position.z);controls.update()};
document.querySelector('#labelsBtn').onclick=()=>{showLabels=!showLabels;updateLabels()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let previousFrame=performance.now();function animate(){requestAnimationFrame(animate);const now=performance.now(),dt=Math.min(.05,(now-previousFrame)/1000);previousFrame=now;updateWalk(dt);updateRide(now);updateElevator(now);updateMeal(now);updateInteraction();controls.update();updateParade(now);renderer.render(scene,camera);updateLabels()}animate();
setTimeout(()=>{const l=document.querySelector('#loading');l.style.opacity=0;setTimeout(()=>l.remove(),550)},900);
</script>
